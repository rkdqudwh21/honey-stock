<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 등록</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
    <h1 class="mb-4 text-center">상품 등록</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form action="/products" method="post" th:object="${product}">
                <div class="mb-3">
                    <label class="form-label">상품명</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">용량</label>
                    <input type="text" th:field="*{size}" class="form-control" placeholder="예: 250g, 500g, 1kg" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">가격</label>
                    <input type="number" th:field="*{price}" class="form-control" min="0" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">설명</label>
                    <input type="text" th:field="*{description}" class="form-control">
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-warning btn-lg">등록</button>
                    <a href="/products" class="btn btn-outline-secondary">목록으로</a>
                    <a href="/" class="btn btn-outline-secondary">메인으로</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
