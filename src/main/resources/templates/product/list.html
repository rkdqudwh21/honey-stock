<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 관리</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
    <h1 class="mb-4 text-center">상품 관리</h1>
    <form action="/products" method="get" class="mb-3">
    <div class="input-group">
        <input type="text"
               name="keyword"
               class="form-control"
               placeholder="상품명, 용량, 설명 검색"
               th:value="${keyword}"
               autocomplete="off">
        <button type="submit" class="btn btn-warning">검색</button>
        <a href="/products" class="btn btn-outline-secondary">초기화</a>
    </div>
</form>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="d-grid gap-2 mb-3">
        <a href="/" class="btn btn-outline-secondary">메인으로</a>
        <a href="/products/new" class="btn btn-warning">상품 등록</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white align-middle">
            <thead class="table-warning text-center">
            <tr>
                <th>ID</th>
                <th>상품명</th>
                <th>용량</th>
                <th>가격</th>
                <th>설명</th>
                <th>관리</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}" class="text-center">1</td>
                <td th:text="${product.name}">아카시아꿀</td>
                <td th:text="${product.size}" class="text-center">250g</td>
                <td th:text="${product.price}" class="text-end">25000</td>
                <td th:text="${product.description}">기본 상품</td>
                <td class="text-center">
                    <a th:href="@{/products/{id}/edit(id=${product.id})}"
                       class="btn btn-sm btn-outline-primary">
                        수정
                    </a>

                    <form th:action="@{/products/{id}/delete(id=${product.id})}"
                          method="post"
                          style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-outline-danger">
                            삭제
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
