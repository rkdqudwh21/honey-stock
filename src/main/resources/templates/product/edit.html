<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 수정</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
    <h1 class="mb-4 text-center">상품 수정</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/products/{id}/edit(id=${product.id})}" method="post">
                <div class="mb-3">
                    <label class="form-label">상품명</label>
                    <input type="text" name="name" th:value="${product.name}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">용량</label>
                    <input type="text" name="size" th:value="${product.size}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">가격</label>
                    <input type="number" name="price" th:value="${product.price}" class="form-control" min="0" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">설명</label>
                    <input type="text" name="description" th:value="${product.description}" class="form-control">
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">수정 완료</button>
                    <a href="/products" class="btn btn-outline-secondary">목록으로</a>
                    <a href="/" class="btn btn-outline-secondary">메인으로</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
