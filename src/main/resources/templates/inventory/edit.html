<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재고 수정</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
    <h1 class="mb-4 text-center">재고 수정</h1>

    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <p class="mb-2">
                <strong>상품</strong><br>
                <span th:text="${inventory.product.name}">아카시아꿀</span>
                /
                <span th:text="${inventory.product.size}">500g</span>
            </p>

            <p class="mb-0">
                <strong>창고</strong><br>
                <span th:text="${inventory.warehouse.region}">서울</span>
                /
                <span th:text="${inventory.warehouse.name}">서울 창고</span>
            </p>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/inventories/{id}/edit(id=${inventory.id})}" method="post">

                <div class="mb-3">
                    <label class="form-label">재고 수량</label>
                    <input type="number"
                           name="quantity"
                           th:value="${inventory.quantity}"
                           class="form-control"
                           min="0"
                           required>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">수정 완료</button>
                    <a href="/inventories" class="btn btn-outline-success">재고 현황</a>
                    <a href="/" class="btn btn-outline-secondary">메인으로</a>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
