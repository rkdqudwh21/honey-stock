<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재고 현황</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
    <h1 class="mb-4 text-center">재고 현황</h1>
    <form action="/inventories" method="get" class="mb-3">
    <div class="input-group">
        <input type="text"
               name="keyword"
               class="form-control"
               placeholder="상품명, 창고명, 지역 검색"
               th:value="${keyword}">
        <button type="submit" class="btn btn-success">검색</button>
        <a href="/inventories" class="btn btn-outline-secondary">초기화</a>
    </div>
</form>
    <div class="d-grid gap-2 mb-3">
        <a href="/" class="btn btn-outline-secondary">메인으로</a>
        <a href="/inventories/new" class="btn btn-success">재고 등록</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white align-middle">
            <thead class="table-success text-center">
            <tr>
                <th>ID</th>
                <th>상품명</th>
                <th>용량</th>
                <th>창고명</th>
                <th>지역</th>
                <th>재고 수량</th>
                <th>상태</th>
                <th>관리</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="inventory : ${inventories}"
                th:classappend="${inventory.quantity <= 5} ? 'table-danger' : ''">
                <td th:text="${inventory.id}" class="text-center">1</td>
                <td th:text="${inventory.product.name}">아카시아꿀</td>
                <td th:text="${inventory.product.size}" class="text-center">250</td>
                <td th:text="${inventory.warehouse.name}">서울 창고</td>
                <td th:text="${inventory.warehouse.region}" class="text-center">서울</td>
                <td th:text="${inventory.quantity}" class="text-end">20</td>

                <td class="text-center">
                    <span th:if="${inventory.quantity <= 5}" class="badge bg-danger">재고 부족</span>
                    <span th:if="${inventory.quantity > 5}" class="badge bg-success">정상</span>
                </td>

                <td class="text-center">
                    <a th:href="@{/inventories/{id}/edit(id=${inventory.id})}"
                       class="btn btn-sm btn-outline-primary">
                        수정
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
