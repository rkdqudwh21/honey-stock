<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판매 내역</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
    <h1 class="mb-4 text-center">판매 내역</h1>
    <form action="/sales" method="get" class="mb-3">
    <div class="input-group">
        <input type="text"
               name="keyword"
               class="form-control"
               placeholder="상품명, 창고명, 지역, 메모 검색"
               th:value="${keyword}"
               autocomplete="off">
        <button type="submit" class="btn btn-primary">검색</button>
        <a href="/sales" class="btn btn-outline-secondary">초기화</a>
    </div>
</form>
<form action="/sales" method="get" class="mb-3">
    <div class="row g-2">

        <div class="col-md-6">
            <input type="text"
                   name="keyword"
                   class="form-control"
                   placeholder="상품명, 창고명, 지역, 메모 검색"
                   th:value="${keyword}"
                   autocomplete="off">
        </div>

        <div class="col-md-4">
            <input type="date"
                   name="date"
                   class="form-control"
                   th:value="${date}">
        </div>

        <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-primary">검색</button>
        </div>
    </div>

    <div class="mt-2">
        <a href="/sales" class="btn btn-outline-secondary w-100">초기화</a>
    </div>
</form>
<div class="row mb-3">
    <div class="col-md-6 mb-2">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h5 class="card-title">총 판매수량</h5>
                <p class="card-text fs-4 fw-bold" th:text="${totalQuantity}">0</p>
            </div>
        </div>
    </div>

    <div class="col-md-6 mb-2">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h5 class="card-title">총 매출</h5>
                <p class="card-text fs-4 fw-bold" th:text="${totalAmount + '원'}">0원</p>
            </div>
        </div>
    </div>
</div>
    <div class="d-grid gap-2 mb-3">
        <a href="/" class="btn btn-outline-secondary">메인으로</a>
        <a href="/sales/new" class="btn btn-primary">판매 등록</a>
        <a href="/inventories" class="btn btn-outline-success">재고 현황</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white align-middle">
            <thead class="table-primary text-center">
            <tr>
                <th>ID</th>
                <th>상품명</th>
                <th>용량</th>
                <th>창고명</th>
                <th>지역</th>
                <th>판매 수량</th>
                <th>총 판매금액</th>
                <th>판매일시</th>
                <th>메모</th>
                <th>관리</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="sale : ${sales}">
                <td th:text="${sale.id}" class="text-center">1</td>
                <td th:text="${sale.product.name}">아카시아꿀</td>
                <td th:text="${sale.product.size}" class="text-center">250</td>
                <td th:text="${sale.warehouse.name}">서울 창고</td>
                <td th:text="${sale.warehouse.region}" class="text-center">서울</td>
                <td th:text="${sale.quantity}" class="text-end">2</td>
                <td th:text="${sale.totalPrice}" class="text-end">50000</td>
                <td th:text="${sale.saleDate}" class="text-center">2026-05-16</td>
                <td th:text="${sale.memo}">현장 판매</td>
                <td class="text-center">
                    <form th:action="@{/sales/{id}/cancel(id=${sale.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-outline-danger">취소</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
</html>
