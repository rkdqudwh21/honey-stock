<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판매 등록</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
    <h1 class="mb-4 text-center">판매 등록</h1>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
        오류 메시지
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form action="/sales" method="post">
                <div class="mb-3">
                    <label class="form-label">상품</label>
                    <select name="productId" class="form-select" required>
                        <option th:each="product : ${products}"
                                th:value="${product.id}"
                                th:text="${product.name + ' / ' + product.size + ' / ' + product.price + '원'}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">창고</label>
                    <select name="warehouseId" class="form-select" required>
                        <option th:each="warehouse : ${warehouses}"
                                th:value="${warehouse.id}"
                                th:text="${warehouse.region + ' / ' + warehouse.name}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">판매 수량</label>
                    <input type="number" name="quantity" min="1" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">메모</label>
                    <input type="text" name="memo" class="form-control" placeholder="예: 현장 판매, 전화 주문">
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">판매 등록</button>
                    <a href="/sales" class="btn btn-outline-primary">판매 내역</a>
                    <a href="/inventories" class="btn btn-outline-success">재고 현황</a>
                    <a href="/" class="btn btn-outline-secondary">메인으로</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
