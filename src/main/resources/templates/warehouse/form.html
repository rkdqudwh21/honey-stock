<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창고 등록</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
    <h1 class="mb-4 text-center">창고 등록</h1>

    <div class="card shadow-sm">
        <div class="card-body">

            <form action="/warehouses" method="post" th:object="${warehouse}">

                <div class="mb-3">
                    <label class="form-label">창고명</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">지역</label>
                    <input type="text" th:field="*{region}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">주소</label>
                    <input type="text" th:field="*{address}" class="form-control">
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-warning btn-lg">등록</button>

                    <a href="/warehouses" class="btn btn-outline-secondary">
                        목록으로
                    </a>

                    <a href="/" class="btn btn-outline-secondary">
                        메인으로
                    </a>
                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
