<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창고 관리</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
    <h1 class="mb-4 text-center">창고 관리</h1>
    <form action="/warehouses" method="get" class="mb-3">
    <div class="input-group">
        <input type="text"
               name="keyword"
               class="form-control"
               placeholder="창고명, 지역, 주소 검색"
               th:value="${keyword}"
               autocomplete="off">
        <button type="submit" class="btn btn-warning">검색</button>
        <a href="/warehouses" class="btn btn-outline-secondary">초기화</a>
    </div>
</form>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="d-grid gap-2 mb-3">
        <a href="/" class="btn btn-outline-secondary">메인으로</a>
        <a href="/warehouses/new" class="btn btn-warning">창고 등록</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white align-middle">
            <thead class="table-warning text-center">
            <tr>
                <th>ID</th>
                <th>창고명</th>
                <th>지역</th>
                <th>주소</th>
                <th>관리</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="warehouse : ${warehouses}">
                <td th:text="${warehouse.id}" class="text-center">1</td>
                <td th:text="${warehouse.name}">서울 창고</td>
                <td th:text="${warehouse.region}" class="text-center">서울</td>
                <td th:text="${warehouse.address}">서울시 강동구</td>

                <td class="text-center">
                    <a th:href="@{/warehouses/{id}/edit(id=${warehouse.id})}"
                       class="btn btn-sm btn-outline-primary">
                        수정
                    </a>

                    <form th:action="@{/warehouses/{id}/delete(id=${warehouse.id})}"
                          method="post"
                          style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-outline-danger">
                            삭제
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
